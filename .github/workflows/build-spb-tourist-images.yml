name: Build SPb tourist images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_spb_tourist_images.py'

permissions:
  contents: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate six JPEG images
        run: python scripts/generate_spb_tourist_images.py

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('avito/tourist-protection/sankt-peterburg')
          files = sorted(root.glob('*.jpg'))
          assert [p.name for p in files] == [f'{i:02d}.jpg' for i in range(1, 7)]
          for p in files:
              with Image.open(p) as im:
                  assert im.format == 'JPEG'
                  assert im.size == (1920, 1440)
              assert p.stat().st_size > 100000
              print(p, p.stat().st_size)
          PY

      - name: Commit generated images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add avito/tourist-protection/sankt-peterburg/*.jpg
          if git diff --cached --quiet; then
            echo 'Images are already current.'
            exit 0
          fi
          git commit -m 'Generate Alistek tourist images for Saint Petersburg'
          git push
