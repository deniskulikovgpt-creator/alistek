name: Build SPb tourist images

on:
  push:
    branches:
      - main
    paths:
      - 'avito/_staging/tourist-protection/sankt-peterburg/manifest.json'

permissions:
  contents: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify images
        shell: bash
        run: |
          set -euo pipefail
          SRC='avito/_staging/tourist-protection/sankt-peterburg'
          DST='avito/tourist-protection/sankt-peterburg'
          TMP="$(mktemp -d)"
          mkdir -p "$DST" "$TMP/unpacked"

          test "$(find "$SRC" -maxdepth 1 -name 'images.tar.xz.b64.seg*' | wc -l)" -eq 14
          cat "$SRC"/images.tar.xz.b64.seg* | tr -d '\n\r ' | base64 --decode > "$TMP/images.tar.xz"
          echo 'baa5578ec63b2145af66f8fa66ba4abe1f5d08e5bf9d3b697e0899e026df6d3a  '"$TMP/images.tar.xz" | sha256sum -c -
          tar -xJf "$TMP/images.tar.xz" -C "$TMP/unpacked"

          for n in 01 02 03 04 05 06; do
            test -f "$TMP/unpacked/$n.jpg"
            test "$(head -c 2 "$TMP/unpacked/$n.jpg" | xxd -p)" = 'ffd8'
            test "$(tail -c 2 "$TMP/unpacked/$n.jpg" | xxd -p)" = 'ffd9'
            cp "$TMP/unpacked/$n.jpg" "$DST/$n.jpg"
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              '01.jpg': (40082, 'baab874aaab2b5fb36bbcac8757792eae751b30a248197b3e343b2a3166a9520'),
              '02.jpg': (34539, '37c0a1e9768554a1949a49d9b1d196d0075e3be4575e24eb5e519d872001e1e4'),
              '03.jpg': (40515, '16f16a774cbbec7d769911b795d59b0a7af995e72d1d0c5f9b7e0c6ad06d1902'),
              '04.jpg': (36458, '6448244786c780ffc28a3282abb2fdeec4595d2bd67d1e365ee3517b7543958c'),
              '05.jpg': (36394, '252ac49c8520ff54e6cebf47c0596cbe358cbc1ddbb8902a79b6619149dbdf7e'),
              '06.jpg': (41126, 'ae3212ddfe1742b2329bf6c2d5f673372201217a95c6904ff6ffac6056abc63c'),
          }
          root = Path('avito/tourist-protection/sankt-peterburg')
          for name, (size, sha) in expected.items():
              p = root / name
              data = p.read_bytes()
              assert len(data) == size, (name, len(data), size)
              assert hashlib.sha256(data).hexdigest() == sha, name
              print(name, len(data), sha)
          PY

      - name: Commit generated images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add avito/tourist-protection/sankt-peterburg/*.jpg
          if git diff --cached --quiet; then
            echo 'Images are already current.'
            exit 0
          fi
          git commit -m 'Add Alistek tourist images for Saint Petersburg'
          git push
