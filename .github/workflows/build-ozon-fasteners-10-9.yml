name: Build Ozon fasteners 10.9 rich content

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_ozon_fasteners_10_9.py'

permissions:
  contents: write

jobs:
  build-rich-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate 13 Ozon JPEG slides
        run: python scripts/generate_ozon_fasteners_10_9.py

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('ozon/rich-content/fasteners-10-9-v3')
          files = sorted(root.glob('slide_*.jpg'))
          assert [p.name for p in files] == [f'slide_{i:02d}.jpg' for i in range(1, 14)]
          for p in files:
              with Image.open(p) as im:
                  assert im.format == 'JPEG'
                  assert im.size == (1440, 720)
              assert p.stat().st_size > 50000
              print(p, p.stat().st_size)
          with Image.open(root / 'preview.jpg') as im:
              assert im.format == 'JPEG'
          PY

      - name: Commit generated rich-content images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ozon/rich-content/fasteners-10-9-v3/*.jpg
          if git diff --cached --quiet; then
            echo 'Images are already current.'
            exit 0
          fi
          git commit -m 'Generate Ozon rich content for fasteners 10.9'
          git push
